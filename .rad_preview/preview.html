<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fintech Analytics KPI Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
    width: 960px;
    height: 580px;
    overflow: hidden;
  }
  input, textarea, select, button { font-family: inherit; } * { spellcheck: false; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #38bdf8; cursor: pointer; box-shadow: 0 0 6px rgba(56,189,248,0.5); }
  :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  ::selection { background: rgba(56,189,248,0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
</style>
</head>
<body spellcheck="false" autocapitalize="none" autocorrect="off">
<div id="lbl_dash" style="position:absolute;left:20px;top:20px;width:460px;height:32px;font-size:18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;color:#10b981;display:flex;align-items:center;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📊 Executive Performance Dashboard</div>
<input autocapitalize='none' autocorrect='off' spellcheck='false' autocomplete='off' id="inp_target" type="text" value="Q3 Target: $4.2M" placeholder="" style="position:absolute;left:20px;top:64px;width:280px;height:34px;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;background:rgba(255, 255, 255, 0.06);color:#e2e8f0;border:1px solid rgba(255, 255, 255, 0.12);border-radius:5px;padding:0 10px;outline:none;">
<div id="progress_target" style="position:absolute;left:320px;top:64px;width:360px;height:34px;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:4px;color:#e2e8f0;"><div style="width:100%;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;"><div style="width:85%;height:100%;background:#38bdf8;border-radius:4px;transition:width 0.3s;"></div></div></div>
<button id="btn_refresh" onclick="try{if(window['on_refresh_click']){window['on_refresh_click'](this.value||'')}else if(window.backendAlert){window.backendAlert('Event: on_refresh_click')}}catch(e){console.error(e)}" style="position:absolute;left:20px;top:110px;width:160px;height:36px;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;background:#10b981;color:#e2e8f0;border:none;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;transition:filter 0.15s,transform 0.1s;box-shadow:0 2px 8px rgba(0,0,0,0.3);" onmouseover="this.style.filter='brightness(1.2)'" onmouseout="this.style.filter=''" onmousedown="this.style.transform='scale(0.97)'" onmouseup="this.style.transform=''">Refresh Data</button>

</body>
</html>
