<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Form1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
    width: 800px;
    height: 600px;
    overflow: hidden;
  }
  input, textarea, select, button { font-family: inherit; } * { spellcheck: false; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #38bdf8; cursor: pointer; box-shadow: 0 0 6px rgba(56,189,248,0.5); }
  :focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  ::selection { background: rgba(56,189,248,0.3); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
  
</style>
<body spellcheck="false" autocapitalize="none" autocorrect="off">
<button id="button_1" title="Button: Clickable action button widget (win.add_button)" onclick="try{if(window['on_button_1_click']){window['on_button_1_click'](this.value||'')}else if(window.backendAlert){window.backendAlert('Event: on_button_1_click')}}catch(e){console.error(e)}" style="position:absolute;left:208px;top:232px;width:150px;height:36px;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;transition:background 0.15s,color 0.15s,filter 0.15s,transform 0.1s;background:#0284c7;color:#ffffff;border:none;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);" onmouseover="this.style.filter='brightness(1.2)'" onmouseout="this.style.filter=''" onmousedown="this.style.transform='scale(0.97)'" onmouseup="this.style.transform=''">Button 1</button>

<script>
  window.showOpenDialog = function(id) { const el = document.getElementById(id); if (el) el.click(); };
  window.showSaveDialog = function(id) { const el = document.getElementById(id); if (el) el.click(); };
  window.getControlValue = function(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    if ("value" in el) return el.value;
    if (el.dataset && el.dataset.value) return el.dataset.value;
    return el.textContent ? el.textContent.trim() : null;
  };
  window.setControlText = function(id, text) {
    const el = document.getElementById(id);
    if (el) { if ("value" in el) el.value = text; else el.textContent = text; }
  };
  window.setControlValue = function(id, val) {
    const el = document.getElementById(id);
    if (el) { if ("value" in el) el.value = val; else el.textContent = val; }
  };
  window.setControlEnabled = function(id, enabled) {
    const el = document.getElementById(id);
    if (el) { el.disabled = !enabled; el.style.opacity = enabled ? "1" : "0.55"; el.style.pointerEvents = enabled ? "auto" : "none"; }
  };
  window.setControlVisible = function(id, visible) {
    const el = document.getElementById(id);
    if (el) { el.style.display = visible ? "" : "none"; }
  };
  window.setStatChart = function(id, opts) {
    const c = document.getElementById(id);
    if (c) {
      if (opts.title) { const t = c.querySelector("span"); if (t) t.textContent = opts.title; }
      if (opts.value) { const v = c.querySelector("div:nth-child(2)"); if (v) v.textContent = opts.value; }
      if (opts.trend) { const tr = c.querySelectorAll("span")[1]; if (tr) tr.textContent = opts.trend; }
    }
  };
  window.setToast = function(id, title, msg, alertType) {
    const c = document.getElementById(id);
    if (c) {
      if (title) { const tEl = c.querySelector("span:nth-child(1)"); if (tEl) tEl.textContent = title; }
      if (msg) { const mEl = c.querySelector("span:nth-child(2)"); if (mEl) mEl.textContent = msg; }
      if (alertType) { c.style.borderLeftColor = alertType==='error'?'#ef4444':alertType==='warning'?'#f59e0b':'#10b981'; }
    }
  };
  window.toggleFullscreen = function() {
    if (window.toggleFullscreenBackend) try { window.toggleFullscreenBackend(); } catch(e){}
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
      else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };
  window.addEventListener("keydown", (e) => {
    if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "q") || (e.altKey && (e.key === "F4" || e.code === "F4"))) {
      e.preventDefault();
      if (window.quitApp) window.quitApp();
      else window.close();
    } else if (e.key === "F11" || e.code === "F11" || ((e.key.toLowerCase() === "f" || e.code === "KeyF") && (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey))) {
      e.preventDefault();
      window.toggleFullscreen();
    }
  });
  window.addEventListener("DOMContentLoaded", () => {
    if (window.onFormLoad) window.onFormLoad();
  });
  window.addEventListener("resize", () => {
    if (window.onFormResize) window.onFormResize({ width: window.innerWidth, height: window.innerHeight });
  });
  window.addEventListener("beforeunload", () => {
    if (window.onFormClose) window.onFormClose();
  });
</script>
</body>
</html>
