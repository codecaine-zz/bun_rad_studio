name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS is the platform the tests were verified on; other platforms have not been tried.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails only when a file gets more type errors than recorded in scripts/typecheck_baseline.json.
      - name: Type-check ratchet
        run: bun run typecheck

      - name: Documentation links and generated pages
        run: bun run docs:check

      # The MySQL and PostgreSQL suites skip themselves when no server is configured.
      - name: Tests
        run: bun test
