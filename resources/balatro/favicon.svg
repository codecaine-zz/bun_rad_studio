<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="jokerHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="6" y="4" width="52" height="56" rx="6" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2" filter="url(#neonGlow)"/>
  <!-- Corner J's -->
  <text x="11" y="16" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#ec4899" text-anchor="middle">J</text>
  <text x="53" y="54" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#ec4899" text-anchor="middle">J</text>
  <!-- Joker Hat Bells & Face -->
  <path d="M 22 28 C 16 18, 12 24, 18 20 C 24 24, 26 28, 28 32 C 30 24, 34 16, 32 18 C 30 20, 36 24, 38 32 C 40 28, 44 24, 48 20 C 52 24, 48 28, 42 28 Z" fill="url(#jokerHat)" filter="url(#neonGlow)"/>
  <!-- Center Face / Jester Mask -->
  <circle cx="32" cy="36" r="9" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Smiling Eyes -->
  <path d="M 28 34 Q 30 32 32 34" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 32 34 Q 34 32 36 34" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Jester Smile -->
  <path d="M 27 38 Q 32 44 37 38" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Bells -->
  <circle cx="16" cy="20" r="2.5" fill="#fbbf24"/>
  <circle cx="32" cy="16" r="2.5" fill="#fbbf24"/>
  <circle cx="48" cy="20" r="2.5" fill="#fbbf24"/>
  <!-- Flaming Sparkles -->
  <circle cx="46" cy="10" r="1.5" fill="#00f3ff"/>
  <circle cx="14" cy="50" r="1.5" fill="#ec4899"/>
</svg>
