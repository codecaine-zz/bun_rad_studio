<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1024"/>
      <stop offset="50%" stop-color="#171f42"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>
    <linearGradient id="blockGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="rainbowDock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Neon Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- FreeBSD Daemon Red Horns (Left & Right of Helmet) -->
  <path d="M14 21 C9 13, 12 7, 19 11 C16 14, 16 18, 18 21 Z" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>
  <path d="M50 21 C55 13, 52 7, 45 11 C48 14, 48 18, 46 21 Z" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>

  <!-- Tux Linux Penguin Flipper (Left Side) & Win95 Window Frame (Right Side) -->
  <path d="M13 36 C6 33, 6 44, 13 46 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="47" y="33" width="11" height="11" rx="1.5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="48" y="34" width="9" height="2.5" fill="#eff6ff"/>

  <!-- Glowing Mystery Block (Center) -->
  <rect x="16" y="23" width="32" height="28" rx="5" fill="url(#blockGold)" stroke="#fef08a" stroke-width="2"/>
  <circle cx="20" cy="27" r="1.5" fill="#78350f"/>
  <circle cx="44" cy="27" r="1.5" fill="#78350f"/>
  <circle cx="20" cy="47" r="1.5" fill="#78350f"/>
  <circle cx="44" cy="47" r="1.5" fill="#78350f"/>

  <!-- Question Mark on Mystery Block -->
  <path d="M27 32 C27 28.5, 37 28.5, 37 33.5 C37 36.5, 32 36.5, 32 39.5" fill="none" stroke="#fffbeb" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="32" cy="44.5" r="2.1" fill="#fffbeb"/>

  <!-- Builder Hard Hat on Top -->
  <path d="M18 22 C18 11, 46 11, 46 22 Z" fill="url(#helmetGrad)" stroke="#ca8a04" stroke-width="1.8"/>
  <rect x="29" y="11" width="6" height="11" rx="2" fill="#fef9c3"/>
  <rect x="14" y="21" width="36" height="4" rx="2" fill="#facc15" stroke="#a16207" stroke-width="1.2"/>

  <!-- Crossed Golden Wrench Badge -->
  <path d="M43 44 L54 55" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="42" cy="43" r="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

  <!-- macOS Rainbow Dock Bar at Base -->
  <rect x="12" y="54" width="40" height="4.5" rx="2.2" fill="url(#rainbowDock)" stroke="#e2e8f0" stroke-width="0.8"/>
</svg>
