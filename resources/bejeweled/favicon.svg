  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Outer Hypercube Lightning Frame -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="none" stroke="url(#goldArc)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.75"/>
  <!-- Crown Facets -->
  <polygon points="18,14 46,14 54,26 10,26" fill="url(#gemTop)" stroke="#e0f2fe" stroke-width="1"/>
  <polygon points="24,14 40,14 43,26 21,26" fill="#ffffff" fill-opacity="0.45"/>
  <!-- Pavilion Facets -->
  <polygon points="10,26 21,26 32,54" fill="url(#gemLeft)" stroke="#bae6fd" stroke-width="0.9"/>
  <polygon points="21,26 43,26 32,54" fill="url(#gemCenter)" stroke="#e0f2fe" stroke-width="0.9"/>
  <polygon points="43,26 54,26 32,54" fill="url(#gemRight)" stroke="#bae6fd" stroke-width="0.9"/>
  <!-- Specular Glint Stars -->
  <path d="M20 12 L21.5 17 L26.5 18.5 L21.5 20 L20 25 L18.5 20 L13.5 18.5 L18.5 17 Z" fill="#ffffff"/>
  <path d="M47 32 L48 35 L51 36 L48 37 L47 40 L46 37 L43 36 L46 35 Z" fill="#fef08a"/>
