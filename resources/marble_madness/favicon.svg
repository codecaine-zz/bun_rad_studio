<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="voidBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#090d1e"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="rampTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="rampWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="marbleSphere" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#00f5d4"/>
      <stop offset="56%" stop-color="#0284c7"/>
      <stop offset="82%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="goldTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#voidBg)" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Isometric Checkerboard Ramp Top Surface -->
  <polygon points="8,36 34,20 58,34 32,50" fill="url(#rampTop)" stroke="#7dd3fc" stroke-width="1.1"/>
  <!-- Isometric Grid Lines -->
  <line x1="17" y1="30.5" x2="43" y2="44.5" stroke="#e0f2fe" stroke-width="0.7" opacity="0.6"/>
  <line x1="25" y1="25.5" x2="51" y2="39.5" stroke="#e0f2fe" stroke-width="0.7" opacity="0.6"/>
  <line x1="20" y1="43" x2="46" y2="27" stroke="#e0f2fe" stroke-width="0.7" opacity="0.6"/>
  <!-- Isometric Cliff Left & Right Shaded Walls -->
  <polygon points="8,36 32,50 32,58 8,44" fill="url(#rampWall)" stroke="#38bdf8" stroke-width="0.8"/>
  <polygon points="32,50 58,34 58,42 32,58" fill="#090d1e" stroke="#a855f7" stroke-width="0.8"/>

  <!-- Speed Motion Trail -->
  <path d="M22,18 Q28,23 33,28" stroke="url(#goldTrail)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Marble Drop Shadow -->
  <ellipse cx="34" cy="34.5" rx="11" ry="5.2" fill="#020617" opacity="0.65"/>

  <!-- 3D Reflective Glass Marble -->
  <g>
    <circle cx="33" cy="24" r="13.5" fill="url(#marbleSphere)" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.85"/>
    <!-- Internal Latitude/Longitude Ribbon Swirl -->
    <path d="M21 21 Q33 30 45 21" stroke="#facc15" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M23 29 Q33 17 43 29" stroke="#00f5d4" stroke-width="1.6" fill="none" opacity="0.75"/>
    <!-- Specular Glass Highlight -->
    <ellipse cx="28" cy="18.5" rx="4.8" ry="2.6" transform="rotate(-26 28 18.5)" fill="#ffffff" opacity="0.82"/>
    <circle cx="25" cy="22" r="1.3" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>
