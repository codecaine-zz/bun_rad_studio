<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02030a"/>
      <stop offset="100%" stop-color="#0a1026"/>
    </linearGradient>
    <linearGradient id="vec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.65"/>
  <!-- Jagged Vector Asteroid -->
  <polygon points="14,16 24,10 35,14 40,22 33,31 21,30 12,24" fill="none" stroke="#ff007f" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Vector Ship -->
  <polygon points="42,26 54,52 42,45 30,52" fill="none" stroke="url(#vec)" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Plasma Bolts -->
  <circle cx="36" cy="18" r="2.2" fill="#ffbe0b"/>
  <circle cx="29" cy="12" r="2.2" fill="#ffbe0b"/>
</svg>
