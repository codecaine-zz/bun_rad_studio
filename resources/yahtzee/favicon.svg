<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a1e"/>
      <stop offset="85%" stop-color="#0a150a"/>
      <stop offset="100%" stop-color="#040904"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="diceWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="diceRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Casino Rim -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="3.5" filter="url(#dropShadow)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6"/>

  <!-- Left Die (Red Vegas Style, angled) -->
  <g transform="translate(18, 22) rotate(-14 20 20)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="url(#diceRed)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- 5 Pips (White) -->
    <circle cx="8" cy="8" r="3.2" fill="#ffffff"/>
    <circle cx="26" cy="8" r="3.2" fill="#ffffff"/>
    <circle cx="17" cy="17" r="3.2" fill="#ffffff"/>
    <circle cx="8" cy="26" r="3.2" fill="#ffffff"/>
    <circle cx="26" cy="26" r="3.2" fill="#ffffff"/>
  </g>

  <!-- Right Die (Ivory Porcelain Style, angled) -->
  <g transform="translate(48, 32) rotate(16 20 20)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="url(#diceWhite)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- 6 Pips (Crimson & Onyx) -->
    <circle cx="9" cy="8" r="3.2" fill="#dc2626"/>
    <circle cx="9" cy="17" r="3.2" fill="#0f172a"/>
    <circle cx="9" cy="26" r="3.2" fill="#0f172a"/>
    <circle cx="25" cy="8" r="3.2" fill="#dc2626"/>
    <circle cx="25" cy="17" r="3.2" fill="#0f172a"/>
    <circle cx="25" cy="26" r="3.2" fill="#0f172a"/>
  </g>

  <!-- Gold Star YACHT Banner Ribbon -->
  <g transform="translate(50, 84)" filter="url(#dropShadow)">
    <rect x="-38" y="-10" width="76" height="16" rx="4" fill="url(#goldRim)" stroke="#451a03" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Cinzel', serif, Arial" font-size="9" font-weight="900" fill="#26160c" letter-spacing="1.5">YACHT</text>
  </g>
</svg>
