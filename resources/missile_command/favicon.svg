<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040614"/>
      <stop offset="100%" stop-color="#0b1736"/>
    </linearGradient>
    <radialGradient id="blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#00ffcc"/>
      <stop offset="80%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#00ffcc" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Incoming ICBM trails -->
  <line x1="12" y1="8" x2="28" y2="28" stroke="#ff0055" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="6" x2="35" y2="24" stroke="#ff0055" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Counter missile trail from Beta battery -->
  <line x1="32" y1="54" x2="32" y2="26" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="3 2" stroke-linecap="round"/>
  <!-- Thermonuclear Plasma Sphere -->
  <circle cx="32" cy="26" r="13" fill="url(#blast)"/>
  <!-- Crosshair -->
  <circle cx="32" cy="26" r="6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Cyber Cities & Horizon -->
  <path d="M6 56 H58" stroke="#00ffcc" stroke-width="2"/>
  <rect x="11" y="49" width="6" height="7" fill="#00bfff"/>
  <rect x="20" y="47" width="5" height="9" fill="#00bfff"/>
  <polygon points="28,56 32,48 36,56" fill="#ffcc00"/>
  <rect x="40" y="48" width="5" height="8" fill="#00bfff"/>
  <rect x="48" y="50" width="6" height="6" fill="#00bfff"/>
</svg>
