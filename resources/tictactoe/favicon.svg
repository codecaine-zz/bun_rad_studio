<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ttt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1c"/>
      <stop offset="100%" stop-color="#040308"/>
    </linearGradient>
    <filter id="ttt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ttt-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Grid Lines -->
  <line x1="26" y1="12" x2="26" y2="52" stroke="#2c1a4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="12" x2="38" y2="52" stroke="#2c1a4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="26" x2="52" y2="26" stroke="#2c1a4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="52" y2="38" stroke="#2c1a4d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neon X in Top Left -->
  <line x1="15" y1="15" x2="23" y2="23" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#ttt-glow)"/>
  <line x1="23" y1="15" x2="15" y2="23" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#ttt-glow)"/>

  <!-- Neon O in Center -->
  <circle cx="32" cy="32" r="4.5" fill="none" stroke="#ff0077" stroke-width="3" filter="url(#ttt-glow)"/>

  <!-- Neon X in Bottom Right -->
  <line x1="41" y1="41" x2="49" y2="49" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#ttt-glow)"/>
  <line x1="49" y1="41" x2="41" y2="49" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#ttt-glow)"/>

  <!-- Neon O in Top Right -->
  <circle cx="45" cy="19" r="4.5" fill="none" stroke="#ff0077" stroke-width="3" filter="url(#ttt-glow)"/>
</svg>
