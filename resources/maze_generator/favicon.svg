<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
    <filter id="mz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#mz-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Maze Walls -->
  <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#mz-glow)">
    <!-- Outer boundary with openings -->
    <path d="M 12 20 L 12 52 L 52 52 L 52 22"/>
    <path d="M 22 12 L 52 12 L 52 16"/>
    <path d="M 12 12 L 16 12"/>
    
    <!-- Internal labyrinth walls -->
    <path d="M 22 12 L 22 26 L 36 26"/>
    <path d="M 32 12 L 32 20"/>
    <path d="M 42 20 L 42 36 L 32 36 L 32 44"/>
    <path d="M 22 36 L 22 44 L 12 44"/>
    <path d="M 42 44 L 46 44"/>
  </g>

  <!-- Glowing Runner Dot -->
  <circle cx="12" cy="16" r="3.5" fill="#00ff88" filter="url(#mz-glow)"/>
  <circle cx="12" cy="16" r="1.5" fill="#ffffff"/>

  <!-- Exit Beacon -->
  <circle cx="52" cy="19" r="2.5" fill="#ff0077" filter="url(#mz-glow)"/>
</svg>
