<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="birdBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arcade Enclosure -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="10" y="10" width="108" height="108" rx="20" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Neon Pipe Silhouette in Background -->
  <rect x="88" y="14" width="22" height="38" rx="4" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <rect x="84" y="46" width="30" height="8" rx="3" fill="#10b981" stroke="#34d399" stroke-width="2"/>

  <rect x="88" y="86" width="22" height="30" rx="4" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <rect x="84" y="82" width="30" height="8" rx="3" fill="#10b981" stroke="#34d399" stroke-width="2"/>

  <!-- Flappy Bird Character -->
  <!-- Flapping Wing -->
  <ellipse cx="44" cy="68" rx="14" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="2" transform="rotate(-25 44 68)"/>

  <!-- Chubby Bird Body -->
  <ellipse cx="58" cy="64" rx="26" ry="22" fill="url(#birdBody)" stroke="#ca8a04" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Big Comic Eye -->
  <ellipse cx="70" cy="54" rx="9" ry="11" fill="#ffffff" stroke="#05070e" stroke-width="2.5"/>
  <ellipse cx="73" cy="54" rx="4.5" ry="6" fill="#0f172a"/>
  <circle cx="75" cy="51" r="2" fill="#ffffff"/>

  <!-- Cute Plump Beak -->
  <path d="M 78 62 L 96 66 L 78 74 Z" fill="url(#beakGrad)" stroke="#9a3412" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
