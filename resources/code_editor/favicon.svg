<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Frame -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" />

  <!-- Subtle grid dots in background -->
  <circle cx="28" cy="28" r="1.5" fill="#475569" opacity="0.4" />
  <circle cx="48" cy="28" r="1.5" fill="#475569" opacity="0.4" />
  <circle cx="68" cy="28" r="1.5" fill="#475569" opacity="0.4" />
  <circle cx="88" cy="28" r="1.5" fill="#475569" opacity="0.4" />
  <circle cx="108" cy="28" r="1.5" fill="#475569" opacity="0.4" />

  <!-- Code Brackets & Slash Icon -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 44 42 L 24 64 L 44 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Forward Slash / -->
    <line x1="72" y1="36" x2="56" y2="92" stroke="url(#slashGrad)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 84 42 L 104 64 L 84 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Terminal Cursor Accent Dot -->
  <circle cx="104" cy="94" r="3.5" fill="#22c55e" filter="url(#glow)" />
</svg>
