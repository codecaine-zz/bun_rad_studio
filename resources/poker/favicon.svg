<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="chipFelt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="80%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="goldRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <!-- Poker Chip Base -->
  <circle cx="32" cy="32" r="30" fill="url(#goldRim)"/>
  <circle cx="32" cy="32" r="26" fill="url(#chipFelt)"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Aces Pair (Spade & Heart) -->
  <rect x="18" y="16" width="18" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" transform="rotate(-12 27 29)"/>
  <rect x="28" y="16" width="18" height="26" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" transform="rotate(12 37 29)"/>

  <!-- Spade Suit on front card -->
  <path d="M37 24 C34 29 28 33 28 38 C28 41 31 43 34 43 C36 43 37 41 37 40 C37 41 38 43 40 43 C43 43 46 41 46 38 C46 33 40 29 37 24 Z" fill="#111827"/>
  <path d="M36 39 L34 44 L40 44 L38 39 Z" fill="#111827"/>

  <!-- Golden Dealer Star / Denomination -->
  <polygon points="32,44 34,49 39,49 35,52 37,57 32,54 27,57 29,52 25,49 30,49" fill="#f59e0b" stroke="#78350f" stroke-width="0.5"/>
</svg>
