<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#090d1e"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="redBalloon" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="cyanBalloon" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="85%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Night Sky Background -->
  <rect width="64" height="64" rx="14" fill="url(#sky)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Twinkling Stars -->
  <circle cx="10" cy="12" r="1.1" fill="#fef08a"/>
  <circle cx="53" cy="10" r="1.3" fill="#bae6fd"/>
  <circle cx="14" cy="44" r="1" fill="#e0f2fe"/>
  <circle cx="56" cy="36" r="1.2" fill="#fde047"/>

  <!-- Bottom Ocean Waves -->
  <path d="M2 55 Q10 51 18 55 T34 55 T50 55 T62 55 L62 62 L2 62 Z" fill="url(#water)" opacity="0.85"/>

  <!-- Balloon Strings -->
  <path d="M23 30 Q26 37 31 41" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M41 28 Q38 36 33 41" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Left Crimson Balloon -->
  <ellipse cx="22" cy="18" rx="10.5" ry="12.5" fill="url(#redBalloon)"/>
  <ellipse cx="18.5" cy="13.5" rx="3.2" ry="4.5" transform="rotate(-18 18.5 13.5)" fill="#ffffff" opacity="0.48"/>
  <polygon points="22,30 20,32.5 24,32.5" fill="#e11d48"/>

  <!-- Right Cyan Balloon -->
  <ellipse cx="41" cy="16" rx="10.5" ry="12.5" fill="url(#cyanBalloon)"/>
  <ellipse cx="37.5" cy="11.5" rx="3.2" ry="4.5" transform="rotate(-18 37.5 11.5)" fill="#ffffff" opacity="0.48"/>
  <polygon points="41,28 39,30.5 43,30.5" fill="#0891b2"/>

  <!-- Cyber Sky Flyer Pilot -->
  <!-- Flapping Wings -->
  <path d="M25 43 L15 38 L18 45 L26 46 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
  <path d="M39 43 L49 38 L46 45 L38 46 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="1"/>
  <!-- Pilot Suit & Helmet -->
  <rect x="27" y="40" width="10" height="10" rx="4" fill="#3b82f6" stroke="#93c5fd" stroke-width="1"/>
  <circle cx="32" cy="36" r="5.2" fill="#f43f5e" stroke="#fecdd3" stroke-width="1"/>
  <!-- Cyber Visor -->
  <rect x="28.5" y="34.2" width="7" height="3.2" rx="1.5" fill="#fef08a"/>

  <!-- Lightning Spark Bolt -->
  <polygon points="52,18 46,26 51,26 47,34 56,24 51,24" fill="url(#spark)"/>
</svg>
