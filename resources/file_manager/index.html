<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="fm-token" content="__FM_TOKEN__">
<meta name="fm-nonce" content="__FM_NONCE__">
<meta name="fm-platform" content="__FM_PLATFORM__">
<meta name="fm-start" content="__FM_START__">
<title>File Manager</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <a class="skip-link" href="#list">Skip to the files</a>

  <div id="app">
    <header id="toolbar" role="toolbar" aria-label="Actions"></header>

    <div id="addressbar">
      <div class="address-main">
        <nav id="crumbs" aria-label="Where you are. Click an empty part to type a location."></nav>
        <input id="address-input" type="text" class="address-input" aria-label="Type a folder location and press Enter" spellcheck="false" autocomplete="off" hidden>
        <button id="edit-address" type="button" class="icon-btn" title="Type a location (Ctrl+L)" aria-label="Type a location">✎</button>
      </div>
      <div class="search" role="search">
        <input id="search" type="search" class="search-input" placeholder="Search" autocomplete="off" spellcheck="false">
        <button id="search-go" type="button" class="icon-btn" title="Search" aria-label="Search">🔍</button>
      </div>
    </div>

    <div id="body">
      <nav id="sidebar" aria-label="Places"></nav>

      <main id="main">
        <div id="tasks" class="tasks" role="region" aria-label="Background tasks" hidden></div>
        <div id="banner" class="banner" hidden></div>
        <div id="list-head" class="list-head" hidden>
          <span class="h-icon"></span>
          <button type="button" class="h-name" data-sort="name">Name</button>
          <span class="h-where" hidden>Folder</span>
          <button type="button" class="h-date" data-sort="modified">Date modified</button>
          <button type="button" class="h-type" data-sort="type">Type</button>
          <button type="button" class="h-size" data-sort="size">Size</button>
        </div>
        <div id="list-wrap">
          <div id="list" role="listbox" tabindex="0" aria-multiselectable="true" aria-label="Files and folders"></div>
          <div id="empty" class="empty" hidden></div>
        </div>
      </main>

      <aside id="info" aria-label="Details" hidden></aside>
    </div>

    <section id="terminal-panel" aria-label="Terminal" hidden>
      <div id="terminal-resizer" role="separator" aria-orientation="horizontal" aria-label="Terminal height. Press the up or down arrow key to change it." tabindex="0"></div>
      <div class="term-bar">
        <span id="terminal-title" class="term-title">Terminal</span>
        <span class="term-note">A real terminal: things deleted here skip the Recycle Bin and can't be undone.</span>
        <span class="term-actions">
          <button id="terminal-cd" type="button" class="term-btn" title="Move the terminal to the folder you are looking at">Go to this folder</button>
          <button id="terminal-restart" type="button" class="term-btn" title="End this shell and start a new one in the folder you are looking at">Restart</button>
          <button id="terminal-close" type="button" class="term-btn term-close" title="Hide the terminal (Ctrl+`). It keeps running." aria-label="Hide the terminal">✕</button>
        </span>
      </div>
      <div id="terminal-host" class="term-host"></div>
    </section>

    <footer id="status">
      <span id="status-left" aria-live="off"></span>
      <span id="status-right"><span class="busy-indicator">Working…</span></span>
    </footer>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="toasts"></div>
  <div id="overlay"></div>

  <noscript>The File Manager needs JavaScript, which is turned off in this window.</noscript>
  <script type="module" src="/ui/main.js"></script>
</body>
</html>
