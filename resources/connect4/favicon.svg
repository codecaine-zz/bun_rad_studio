<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#04060e"/>
    </linearGradient>
    <filter id="c4-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#c4-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Blue Connect 4 Frame -->
  <rect x="10" y="14" width="44" height="38" rx="6" fill="#0d1b38" stroke="#1d4ed8" stroke-width="2"/>

  <!-- Disc Grid (4 columns x 3 rows) -->
  <!-- Row 1 -->
  <circle cx="17" cy="22" r="4" fill="#070d1a"/>
  <circle cx="27" cy="22" r="4" fill="#070d1a"/>
  <circle cx="37" cy="22" r="4" fill="#070d1a"/>
  <circle cx="47" cy="22" r="4" fill="#ff0077" filter="url(#c4-glow)"/>

  <!-- Row 2 -->
  <circle cx="17" cy="33" r="4" fill="#070d1a"/>
  <circle cx="27" cy="33" r="4" fill="#00f0ff" filter="url(#c4-glow)"/>
  <circle cx="37" cy="33" r="4" fill="#ff0077" filter="url(#c4-glow)"/>
  <circle cx="47" cy="33" r="4" fill="#00f0ff" filter="url(#c4-glow)"/>

  <!-- Row 3 -->
  <circle cx="17" cy="44" r="4" fill="#ff0077" filter="url(#c4-glow)"/>
  <circle cx="27" cy="44" r="4" fill="#ff0077" filter="url(#c4-glow)"/>
  <circle cx="37" cy="44" r="4" fill="#00f0ff" filter="url(#c4-glow)"/>
  <circle cx="47" cy="44" r="4" fill="#00f0ff" filter="url(#c4-glow)"/>

  <!-- Winning Line Glow Connecting Pink Diagonal -->
  <line x1="17" y1="44" x2="47" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" filter="url(#c4-glow)"/>
</svg>
