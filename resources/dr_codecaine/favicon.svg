<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#pill-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Angled Pill Capsule -->
  <g transform="rotate(-45 32 32)">
    <!-- Red Left Half -->
    <path d="M 18 24 A 8 8 0 0 0 18 40 L 32 40 L 32 24 Z" fill="#ff3366" filter="url(#pill-glow)"/>
    <!-- Cyan Right Half -->
    <path d="M 32 24 L 32 40 L 46 40 A 8 8 0 0 0 46 24 Z" fill="#00d2ff" filter="url(#pill-glow)"/>
    <!-- Seam line -->
    <line x1="32" y1="23" x2="32" y2="41" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Specular highlight -->
    <ellipse cx="24" cy="28" rx="4" ry="1.5" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="38" cy="28" rx="4" ry="1.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Small viral microbe helper icon -->
  <circle cx="50" cy="16" r="4.5" fill="#ffcc00" filter="url(#pill-glow)"/>
  <circle cx="48.5" cy="15" r="0.9" fill="#000000"/>
  <circle cx="51.5" cy="15" r="0.9" fill="#000000"/>
</svg>
