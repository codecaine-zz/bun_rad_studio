<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0b192c"/>
    </linearGradient>
    <linearGradient id="munchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arcade Enclosure -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.5"/>
  <rect x="10" y="10" width="108" height="108" rx="20" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Cyber Muncher Body (Open Mouth Chomping) -->
  <path d="M 64 24 C 84 24 100 40 100 64 C 100 70 98 76 94 82 L 64 64 L 94 46 C 98 52 100 58 100 64 C 100 84 84 100 64 100 C 44 100 28 84 28 64 C 28 44 44 24 64 24 Z" fill="url(#munchGrad)" filter="url(#glow)"/>

  <!-- Big Glowing Eyes -->
  <circle cx="52" cy="46" r="9" fill="#05070e" stroke="#00f3ff" stroke-width="2"/>
  <circle cx="54" cy="44" r="4.5" fill="#ffffff"/>
  <circle cx="56" cy="42" r="1.5" fill="#00f3ff"/>

  <!-- Math Symbol Accents -->
  <!-- Plus Symbol -->
  <path d="M 22 26 H 30 M 26 22 V 30" stroke="#00f3ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Multiply Symbol -->
  <path d="M 102 24 L 110 32 M 110 24 L 102 32" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Divide Symbol -->
  <path d="M 22 104 H 32 M 27 99 A 1 1 0 1 1 27 99.1 M 27 109 A 1 1 0 1 1 27 109.1" stroke="#ffb703" stroke-width="2" stroke-linecap="round"/>
  <!-- Target Number / Morsel in Mouth -->
  <circle cx="86" cy="64" r="8" fill="url(#neonPink)" filter="url(#glow)"/>
  <text x="86" y="68" font-family="monospace" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>
</svg>
