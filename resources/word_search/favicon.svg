<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a1e"/>
      <stop offset="100%" stop-color="#06030a"/>
    </linearGradient>
    <filter id="ws-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ws-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Matrix Grid 3x3 -->
  <g stroke="#3b1d5c" stroke-width="1.5">
    <line x1="12" y1="26" x2="52" y2="26"/>
    <line x1="12" y1="38" x2="52" y2="38"/>
    <line x1="26" y1="12" x2="26" y2="52"/>
    <line x1="38" y1="12" x2="38" y2="52"/>
  </g>

  <!-- Letters in Grid -->
  <text x="19" y="22" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="900" text-anchor="middle" dominant-baseline="middle">W</text>
  <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">O</text>
  <text x="45" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">R</text>

  <text x="19" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="32" y="32" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="900" text-anchor="middle" dominant-baseline="middle">O</text>
  <text x="45" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">D</text>

  <text x="19" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">S</text>
  <text x="32" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">K</text>
  <text x="45" y="45" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="900" text-anchor="middle" dominant-baseline="middle">R</text>

  <!-- Diagonal Word Found Highlight Beam -->
  <line x1="14" y1="16" x2="50" y2="48" stroke="#ff0077" stroke-width="6" stroke-linecap="round" opacity="0.35" filter="url(#ws-glow)"/>
  <line x1="14" y1="16" x2="50" y2="48" stroke="#ff0077" stroke-width="2" stroke-linecap="round" filter="url(#ws-glow)"/>
</svg>
