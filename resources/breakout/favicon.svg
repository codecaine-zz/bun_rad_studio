<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Breakout Pro app icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f051d"/>
      <stop offset="50%" stop-color="#190638"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="12" y="12" width="104" height="104" rx="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Bricks Array (Top Rows) -->
  <!-- Row 1: Neon Cyan -->
  <rect x="22" y="24" width="24" height="10" rx="3" fill="#06b6d4" filter="url(#glow)"/>
  <rect x="52" y="24" width="24" height="10" rx="3" fill="#06b6d4" filter="url(#glow)"/>
  <rect x="82" y="24" width="24" height="10" rx="3" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Row 2: Neon Purple -->
  <rect x="22" y="38" width="24" height="10" rx="3" fill="#a855f7" filter="url(#glow)"/>
  <rect x="52" y="38" width="24" height="10" rx="3" fill="#a855f7" filter="url(#glow)"/>
  <rect x="82" y="38" width="24" height="10" rx="3" fill="#a855f7" filter="url(#glow)"/>

  <!-- Row 3: Neon Hot Pink -->
  <rect x="22" y="52" width="24" height="10" rx="3" fill="#ec4899" filter="url(#glow)"/>
  <rect x="52" y="52" width="24" height="10" rx="3" fill="#f43f5e" filter="url(#glow)"/>
  <rect x="82" y="52" width="24" height="10" rx="3" fill="#ec4899" filter="url(#glow)"/>

  <!-- Ball Trail Laser -->
  <line x1="64" y1="102" x2="72" y2="76" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Energy Ball -->
  <circle cx="74" cy="74" r="8" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="72" cy="72" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- Paddle -->
  <rect x="34" y="104" width="60" height="10" rx="5" fill="url(#paddle)" filter="url(#glow)"/>
  <rect x="42" y="106" width="44" height="3" rx="1.5" fill="#ffffff" opacity="0.75"/>
</svg>
